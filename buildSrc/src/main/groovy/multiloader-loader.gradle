plugins {
    id 'multiloader-common'
    id 'com.modrinth.minotaur'
    id 'de.maxhenkel.cursegradle'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

def commonJavaSource = configurations.commonJava

if (project.name == "fabric") {
    def fabricCommonJavaDir = layout.buildDirectory.dir("generated/sources/fabricCommonJava")
    def prepareFabricCommonJava = tasks.register("prepareFabricCommonJava", Sync) {
        dependsOn(commonJavaSource)
        from(commonJavaSource)
        into(fabricCommonJavaDir)

        filter { String line ->
            line
                .replace("import net.neoforged.api.distmarker.Dist;", "import net.fabricmc.api.EnvType;")
                .replace("import net.neoforged.api.distmarker.OnlyIn;", "import net.fabricmc.api.Environment;")
                .replace("@OnlyIn(Dist.CLIENT)", "@Environment(EnvType.CLIENT)")
                .replace("@OnlyIn(Dist.SERVER)", "@Environment(EnvType.SERVER)")
                .replace("OnlyIn(Dist.CLIENT)", "Environment(EnvType.CLIENT)")
                .replace("OnlyIn(Dist.SERVER)", "Environment(EnvType.SERVER)")
                .replace("Dist.CLIENT", "EnvType.CLIENT")
                .replace("Dist.SERVER", "EnvType.SERVER")
        }
    }

    tasks.named('compileJava', JavaCompile) {
        dependsOn(prepareFabricCommonJava)
        source(fabricCommonJavaDir)
    }

    tasks.named('javadoc', Javadoc).configure {
        dependsOn(prepareFabricCommonJava)
        source(fabricCommonJavaDir)
    }

    tasks.named('sourcesJar', Jar) {
        dependsOn(prepareFabricCommonJava)
        from(fabricCommonJavaDir)
    }
} else {
    tasks.named('compileJava', JavaCompile) {
        dependsOn(commonJavaSource)
        source(commonJavaSource)
    }

    tasks.named('javadoc', Javadoc).configure {
        dependsOn(commonJavaSource)
        source(commonJavaSource)
    }

    tasks.named('sourcesJar', Jar) {
        dependsOn(commonJavaSource)
        from(commonJavaSource)
    }
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

def configureDistributionTasks = { artifactTask ->
    modrinth {
        token = System.getenv("MODRINTH_TOKEN")
        projectId = modrinth_id
        uploadFile = artifactTask
        versionName = mod_id[0].toUpperCase() + mod_id.substring(1) + " " + version
        versionType = "release"
        gameVersions = [minecraft_version]
        loaders = [project.name]
        if(project.name == "fabric") {
            dependencies {
                required.project "fabric-api"
            }
        }
    }

    curseforge {
        apiKey = System.getenv("CURSEFORGE_API_KEY")
        //noinspection GroovyAssignabilityCheck
        project {
            id = curseforge_id
            mainArtifact(artifactTask) {
                displayName = mod_id[0].toUpperCase() + mod_id.substring(1) + " " + version
                releaseType = "release"
                addGameVersion(minecraft_version)
                addGameVersion(project.name == 'fabric' ? "Fabric" : project.name == "neoforge" ? "NeoForge" : "")
                if(project.name == "fabric") {
                    relations {
                        requiredDependency "fabric-api"
                    }
                }
            }
        }
    }
}

if (project.name == "fabric") {
    pluginManager.withPlugin("fabric-loom") {
        configureDistributionTasks(tasks.named("remapJar").get())
    }
} else {
    configureDistributionTasks(tasks.named("jar").get())
}
