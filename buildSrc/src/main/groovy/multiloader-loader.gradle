plugins {
    id 'multiloader-common'
    id 'com.modrinth.minotaur'
    id 'de.maxhenkel.cursegradle'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

def configureDistributionTasks = { artifactTask ->
    modrinth {
        token = System.getenv("MODRINTH_TOKEN")
        projectId = modrinth_id
        uploadFile = artifactTask
        versionName = mod_id[0].toUpperCase() + mod_id.substring(1) + " " + version
        versionType = "release"
        gameVersions = [minecraft_version]
        loaders = [project.name]
        if(project.name == "fabric") {
            dependencies {
                required.project "fabric-api"
            }
        }
    }

    curseforge {
        apiKey = System.getenv("CURSEFORGE_API_KEY")
        //noinspection GroovyAssignabilityCheck
        project {
            id = curseforge_id
            mainArtifact(artifactTask) {
                displayName = mod_id[0].toUpperCase() + mod_id.substring(1) + " " + version
                releaseType = "release"
                addGameVersion(minecraft_version)
                addGameVersion(project.name == 'fabric' ? "Fabric" : project.name == "neoforge" ? "NeoForge" : "")
                if(project.name == "fabric") {
                    relations {
                        requiredDependency "fabric-api"
                    }
                }
            }
        }
    }
}

if (project.name == "fabric") {
    pluginManager.withPlugin("fabric-loom") {
        configureDistributionTasks(tasks.named("remapJar").get())
    }
} else {
    configureDistributionTasks(tasks.named("jar").get())
}
